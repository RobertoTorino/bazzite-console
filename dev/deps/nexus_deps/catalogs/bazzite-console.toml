[[tool]]
name = "umr"
rpm = "umr"
description = "AMD's user-mode register debugger: reads and writes the GPU's registers directly. The suite uses it to see which compute units are switched on and, in CU Bisect, to switch them."
executables = ["umr"]
root = true

[[tool.source]]
owner = "compute"
need = "required"
usage = "Read and change the GPU compute-unit registers."
anchor = "requirements"

[[tool.source]]
owner = "board"
need = "optional"
usage = "Read live GPU registers for the active compute-unit count."

[[tool]]
name = "memtest_vulkan"
description = "A GPU memory tester that runs through Vulkan. Besides finding memory errors it puts a steady, verifiable load on the GPU, which the stress and bisect tests use."
executables = ["memtest_vulkan"]

[[tool.source]]
owner = "compute"
need = "optional"
usage = "Recommended: verify GPU load results during CU testing."
anchor = "requirements"

[[tool.source]]
owner = "gpu"
need = "optional"
usage = "Recommended: verify GPU load results during the GPU sweep."
anchor = "requirements"

[[tool.source]]
owner = "board"
need = "optional"
usage = "Verified GPU load for stress tests."

[[tool]]
name = "stress-ng"
brew = "stress-ng"
rpm = "stress-ng"
description = "A CPU, memory and system stress tool with many load types. It checks its own results, so a core that computes wrong answers is caught, not only one that crashes."
executables = ["stress-ng"]

[[tool.source]]
owner = "cores"
need = "required"
usage = "Verified CPU load during core testing."
anchor = "requirements"

[[tool.source]]
owner = "board"
need = "optional"
usage = "CPU stress/load tests and CPU benchmark."

[[tool]]
name = "vkpeak"
description = "A Vulkan benchmark that measures the GPU's peak compute throughput (FLOPS and IOPS). Used as a GPU benchmark and as a GPU load."
executables = ["vkpeak"]

[[tool.source]]
owner = "compute"
need = "optional"
usage = "Fallback GPU load during CU testing."

[[tool.source]]
owner = "gpu"
need = "optional"
usage = "Fallback GPU load during the GPU sweep."

[[tool.source]]
owner = "board"
need = "optional"
usage = "GPU benchmark and fallback GPU load."

[[tool]]
name = "vkmark"
rpm = "vkmark"
description = "A Vulkan graphics benchmark with several scenes. Used as a GPU load when memtest_vulkan and vkpeak are missing."
executables = ["vkmark"]

[[tool.source]]
owner = "compute"
need = "optional"
usage = "Fallback GPU load during CU testing."

[[tool.source]]
owner = "gpu"
need = "optional"
usage = "GPU load generator for safe-point tests."

[[tool.source]]
owner = "board"
need = "optional"
usage = "Fallback GPU load during stress tests."

[[tool]]
name = "glmark2"
rpm = "glmark2"
description = "An OpenGL graphics benchmark (X11). Used as a GPU load when the Vulkan tools are missing."
executables = ["glmark2"]

[[tool.source]]
owner = "compute"
need = "optional"
usage = "Fallback GPU load during CU testing."

[[tool.source]]
owner = "gpu"
need = "optional"
usage = "GPU load generator for safe-point tests."

[[tool.source]]
owner = "board"
need = "optional"
usage = "Fallback GPU load during stress tests."

[[tool]]
name = "setpci"
rpm = "pciutils"
description = "Reads and writes PCI configuration registers (pciutils). Core Unlock reaches the PS5's SMU through them to switch CPU cores."
executables = ["setpci"]
root = true

[[tool.source]]
owner = "cores"
need = "required"
usage = "Access PS5 SMN/SMU through PCI configuration space."
anchor = "requirements"

[[tool]]
name = "lspci"
rpm = "pciutils"
description = "Lists the PCI devices (pciutils). Core Unlock uses it to make sure the board is a PS5 before it touches the SMU."
executables = ["lspci"]

[[tool.source]]
owner = "cores"
need = "required"
usage = "Used with setpci to access PS5 PCI configuration space."
anchor = "requirements"

[[tool.source]]
owner = "gpu"
need = "optional"
usage = "The diagnostics report lists the graphics devices."

[[tool]]
name = "taskset"
rpm = "util-linux"
description = "Runs a command on chosen CPU threads only (util-linux), so a load tests one core at a time."
executables = ["taskset"]

[[tool.source]]
owner = "cores"
need = "required"
usage = "Pin test loads to specific CPU threads."
anchor = "requirements"

[[tool]]
name = "mprime"
description = "Prime95 for Linux. Its torture test is a long, heavy CPU and memory load that finds marginal cores other tests miss. A download from mersenne.org that is unpacked into a folder, ~/mprime by default; no package installs it."
executables = ["mprime"]
locations = ["~/mprime/mprime", "~/.local/bin/mprime", "/opt/mprime/mprime", "/usr/local/bin/mprime"]

[[tool.source]]
owner = "cores"
need = "optional"
usage = "Prime95 torture test for a longer burn-in."
anchor = "longer-burn-in-mprime-rasdaemon"

[[tool]]
name = "ras-mc-ctl"
rpm = "rasdaemon"
description = "Shows the hardware error counters that rasdaemon records (machine checks and memory errors), including corrected errors that never crash anything."
executables = ["ras-mc-ctl"]
root = true

[[tool.source]]
owner = "cores"
need = "optional"
usage = "Hardware error counters through rasdaemon."
anchor = "longer-burn-in-mprime-rasdaemon"

[[tool]]
name = "sudo"
rpm = "sudo"
description = "Runs a command as root after asking for your password in the terminal. The scripts use it only for the steps that need root."
executables = ["sudo"]

[[tool.source]]
owner = "compute"
need = "required"
usage = "Privilege for GPU register access and kernel log checks."

[[tool.source]]
owner = "cores"
need = "required"
usage = "Privilege for PCI access and kernel log checks."

[[tool.source]]
owner = "gpu"
need = "required"
usage = "Privilege for governor configuration and kernel log checks."
anchor = "requirements"

[[tool.source]]
owner = "board"
need = "required"
usage = "Privilege for system checks and tests that need administrator access."

[[tool]]
name = "journalctl"
rpm = "systemd"
description = "Reads the systemd journal: the system, service and kernel logs."
executables = ["journalctl"]

[[tool.source]]
owner = "cores"
need = "required"
usage = "Check machine-check and kernel errors during testing."

[[tool.source]]
owner = "compute"
need = "required"
usage = "Check GPU kernel errors during testing."

[[tool.source]]
owner = "gpu"
need = "required"
usage = "Read and follow system and service logs."

[[tool.source]]
owner = "quickfix"
need = "optional"
usage = "Persistent Journal moves the journal to the disk and back."

[[tool.source]]
owner = "board"
need = "optional"
usage = "Read system and kernel logs for diagnostics."

[[tool]]
name = "cyan-skillfish-governor-smu"
description = "The GPU governor service made for the BC-250's GPU (Cyan Skillfish): it sets the GPU clock and voltage from the load, through the SMU. Checked by its configuration and service files."
executables = []
locations = ["/etc/cyan-skillfish-governor-smu/config.toml", "/usr/lib/systemd/system/cyan-skillfish-governor-smu.service", "/etc/systemd/system/cyan-skillfish-governor-smu.service"]
probe = "path"

[[tool.source]]
owner = "gpu"
need = "required"
usage = "System service and configuration managed by the GPU Manager."

[[tool]]
name = "busctl"
rpm = "systemd"
description = "Talks to services over D-Bus from the command line (systemd)."
executables = ["busctl"]

[[tool.source]]
owner = "gpu"
need = "required"
usage = "Communicate with the governor service over D-Bus."

[[tool.source]]
owner = "ssd"
need = "required"
usage = "Reads the drives' SMART values from udisks, without root."

[[tool.source]]
owner = "cec"
need = "optional"
usage = "Pauses videos and music while the TV is off."

[[tool.source]]
owner = "bluetooth"
need = "required"
usage = "The search after boot sees with it whether a device's services are read."

[[tool]]
name = "radeontop"
rpm = "radeontop"
description = "Shows the load of the parts of an AMD GPU (shaders, memory, video). The GPU Manager reads the GPU load from it when the kernel's own reading is missing."
executables = ["radeontop"]

[[tool.source]]
owner = "gpu"
need = "optional"
usage = "Fallback GPU load sensor."

