# Bazzite Console Suite runtime packages and system tools.

[app.portal]
name = "Bazzite Console Suite"
launchers = ["~/.local/bin/bazzite-console-suite"]

[app.bazzite]
name = "Bazzite Test"
launchers = ["~/.local/bin/bazzite-test"]

[app.rpcs3]
name = "RPCS3 Manager"
launchers = ["~/.local/bin/ps5-rpcs3-manager"]

[app.remoteplay]
name = "Remote Play"
launchers = ["~/.local/bin/ps5-remoteplay"]

[app.clb]
name = "Xbox Remote Play"
launchers = ["~/.local/bin/ps5-xbox-remoteplay"]

[app.shadps4]
name = "shadPS4 Manager"
launchers = ["~/.local/bin/ps5-shadps4-manager"]

[app.datstation]
name = "Bazzite DatStation"
launchers = ["~/.local/bin/ps5-datstation"]

[app.ppsspp]
name = "PPSSPP Manager"
launchers = ["~/.local/bin/ps5-ppsspp-manager"]

[app.pcsx2]
name = "PCSX2 Manager"
launchers = ["~/.local/bin/ps5-pcsx2-manager"]

[app.vita3k]
name = "Vita3K Manager"
launchers = ["~/.local/bin/ps5-vita3k-manager"]

[app.xenia]
name = "Xenia Manager"
launchers = ["~/.local/bin/ps5-xenia-manager"]

[app.sftp]
name = "SFTP Tools"
launchers = ["~/.local/bin/ps5-sftp-tools"]

[app.webcam]
name = "Webcam"
launchers = ["~/.local/bin/ps5-webcam"]

[app.controller]
name = "Controller"
launchers = ["~/.local/bin/ps5-controller"]

[app.ssd]
name = "SSD Check"
launchers = ["~/.local/bin/ps5-ssd-check"]

[[dependency]]
name = "PyQt6"
description = "The Qt widget toolkit used by every app and the portal."

[[dependency.source]]
owner = "portal"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "bazzite"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "rpcs3"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "remoteplay"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "clb"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "shadps4"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "datstation"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "ppsspp"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "pcsx2"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "vita3k"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "xenia"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "sftp"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "webcam"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "controller"
specifier = ">=6.11,<7"

[[dependency.source]]
owner = "ssd"
specifier = ">=6.11,<7"

[[dependency]]
name = "pygame-ce"
description = "Controller input support used by the portal and Gaming apps."

[[dependency.source]]
owner = "portal"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "rpcs3"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "shadps4"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "datstation"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "ppsspp"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "pcsx2"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "vita3k"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "xenia"
specifier = ">=2.5,<3"

[[dependency.source]]
owner = "clb"
specifier = ">=2.5,<3"

[[dependency]]
name = "aiortc"
description = "WebRTC streaming used by Xbox Remote Play."

[[dependency.source]]
owner = "clb"
specifier = ">=1.14,<2"

[[dependency]]
name = "cryptography"
description = "Cryptographic primitives used for Remote Play and shadPS4 update metadata."

[[dependency.source]]
owner = "remoteplay"
specifier = ">=42,<51"

[[dependency.source]]
owner = "shadps4"
specifier = ">=42,<51"

[[dependency]]
name = "paramiko"
description = "SSH and SFTP support used by SFTP Tools."

[[dependency.source]]
owner = "sftp"
specifier = ">=3.4,<5"

[[tool]]
name = "pkexec"
description = "Opens a privileged prompt for board-wide actions."
executables = ["pkexec"]

[[tool.source]]
owner = "sftp"
usage = "Start or stop the local SSH server."
need = "required"

[[tool.source]]
owner = "webcam"
usage = "Install or remove the camera udev rule."
need = "required"

[[tool]]
name = "udevadm"
description = "Reloads and triggers device rules after Webcam installs a rule."
executables = ["udevadm"]

[[tool.source]]
owner = "webcam"
usage = "Apply the camera device rule."
need = "required"

[[tool]]
name = "systemctl"
description = "Controls the optional local SSH server."
executables = ["systemctl"]

[[tool.source]]
owner = "sftp"
usage = "Start or stop the local SSH server."
need = "optional"

[[tool]]
name = "firewall-cmd"
description = "Checks the firewall state before SFTP Tools opens SSH access."
executables = ["firewall-cmd"]

[[tool.source]]
owner = "sftp"
usage = "Inspect or open the SSH firewall service."
need = "optional"

[[tool]]
name = "notify-send"
description = "Shows Controller's optional desktop notifications."
executables = ["notify-send"]

[[tool.source]]
owner = "controller"
usage = "Show controller status notifications."
need = "optional"

[[tool]]
name = "paplay"
description = "Plays the optional connection sounds in SFTP Tools."
executables = ["paplay"]

[[tool.source]]
owner = "sftp"
usage = "Play connection and transfer sounds."
need = "optional"
