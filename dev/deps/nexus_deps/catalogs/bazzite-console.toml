# Bazzite Console Suite runtime packages and system tools.

[app.portal]
name = "Bazzite Console Suite"
launchers = ["~/.local/bin/bazzite-console-suite"]

[app.core]
name = "Shared core"
launchers = []

[app.board]
name = "PS5 Board Test"
launchers = ["~/.local/bin/ps5-board-test"]

[app.rpcs3]
name = "RPCS3 Manager"
launchers = ["~/.local/bin/ps5-rpcs3-manager"]

[app.remoteplay]
name = "Remote Play"
launchers = ["~/.local/bin/ps5-remoteplay"]

[app.clb]
name = "XBOX Remote Play"
launchers = ["~/.local/bin/ps5-xbox-remoteplay"]

[app.shadps4]
name = "shadPS4 Manager"
launchers = ["~/.local/bin/ps5-shadps4-manager"]

[app.datstation]
name = "PS5 DatStation"
launchers = ["~/.local/bin/ps5-datstation"]

[app.ppsspp]
name = "PPSSPP Manager"
launchers = ["~/.local/bin/ps5-ppsspp-manager"]

[app.pcsx2]
name = "PCSX2 Manager"
launchers = ["~/.local/bin/ps5-pcsx2-manager"]

[app.vita3k]
name = "Vita3K Manager"
launchers = ["~/.local/bin/ps5-vita3k-manager"]

[app.xenia]
name = "Xenia Manager"
launchers = ["~/.local/bin/ps5-xenia-manager"]

[app.sftp]
name = "PS5 SFTP Tools"
launchers = ["~/.local/bin/ps5-sftp-tools"]

[app.webcam]
name = "PS5 Webcam"
launchers = ["~/.local/bin/ps5-webcam"]

[app.controller]
name = "PS5 Controller"
launchers = ["~/.local/bin/ps5-controller"]

[app.ssd]
name = "PS5 SSD Check"
launchers = ["~/.local/bin/ps5-ssd-check"]

[app.overlay]
name = "PS5 System Overlay"
launchers = ["~/.local/bin/ps5-system-overlay"]

[app.fan]
name = "PS5 Fan Controller"
launchers = ["~/.local/bin/ps5-fan-controller"]

[app.cec]
name = "PS5 CEC Manager"
launchers = ["~/.local/bin/ps5-cec-manager"]

[app.upscaler]
name = "PS5 Upscaler Manager"
launchers = ["~/.local/bin/ps5-upscaler"]

[app.bluetooth]
name = "PS5 Bluetooth"
launchers = ["~/.local/bin/ps5-bluetooth"]

