description = "Sends and reads HDMI-CEC messages through the kernel's CEC adapters (v4l-utils). Part of Bazzite."
executables = ["cec-ctl"]

[[tool.source]]
owner = "cec"
usage = "Every message to the TV: power, input and the remote's keys."
need = "required"

[[tool]]
name = "FFmpeg"
description = "The audio and video codec library. Remote Play carries its own inside the app's native core, so nothing is installed on the system for it; checked by asking the installed core which version it holds."
executables = []
locations = ["~/.local/share/ps5-remoteplay/venv/bin/python"]
probe = "console-link-ffmpeg"

[[tool.source]]
owner = "remoteplay"
usage = "Decodes the stream's picture and sound; without it there is no stream. It comes with the app: install the app again through the portal when it is missing."
need = "required"

[[tool]]
name = "bluetoothctl"
description = "BlueZ's command line for Bluetooth. PS5 Bluetooth searches for, pairs and connects the listed devices with it. Part of Bazzite."
executables = ["bluetoothctl"]

[[tool.source]]
owner = "bluetooth"
usage = "The search after boot pairs, trusts and connects the listed devices; the window lists the devices Bluetooth knows and searches for nearby ones."
need = "required"

[[tool]]
name = "dbus-python"
description = "D-Bus for the system's own Python (part of Bazzite). PS5 Bluetooth's battery service runs on the system's Python as root and offers BlueZ the controllers' battery levels with it. Checked by its license file."
executables = []
locations = ["/usr/share/licenses/python3-dbus/COPYING"]
probe = "path"

[[tool.source]]
owner = "bluetooth"
usage = "The battery service: PlayStation controller batteries in the Bluetooth icon."
need = "optional"

[[tool]]
name = "PyGObject"
description = "GLib for the system's own Python (part of Bazzite): the event loop of PS5 Bluetooth's battery service. Checked by its license file."
executables = []
locations = ["/usr/share/licenses/python3-gobject-base/COPYING"]
probe = "path"

[[tool.source]]
owner = "bluetooth"
usage = "The battery service: PlayStation controller batteries in the Bluetooth icon."
need = "optional"

[[tool]]
name = "kwriteconfig6"
description = "Reads and writes KDE's settings files (with kreadconfig6). PS5 Bluetooth sets Plasma's Bluetooth to switch on at every login with it."
executables = ["kwriteconfig6"]

[[tool.source]]
owner = "bluetooth"
usage = "Bluetooth on at every login (Plasma only)."
need = "optional"
