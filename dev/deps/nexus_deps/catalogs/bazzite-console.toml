name = "paramiko"
description = "SSH and SFTP support used by SFTP Tools."

[[dependency.source]]
owner = "sftp"
specifier = ">=3.4,<5"

[[tool]]
name = "pkexec"
description = "Opens a privileged prompt for system-wide actions."
executables = ["pkexec"]

[[tool.source]]
owner = "sftp"
usage = "Start or stop the local SSH server."
need = "required"

[[tool.source]]
owner = "webcam"
usage = "Install or remove the camera udev rule."
need = "required"

[[tool.source]]
owner = "fan"
usage = "Turn the thermal guard on and off, and change it."
need = "required"

[[tool]]
name = "udevadm"
description = "Reloads and triggers device rules after Webcam installs a rule."
executables = ["udevadm"]

[[tool.source]]
owner = "webcam"
usage = "Apply the camera device rule."
need = "required"

[[tool]]
name = "systemctl"
description = "Controls system and user services."
executables = ["systemctl"]

[[tool.source]]
owner = "sftp"
usage = "Start or stop the local SSH server."
need = "optional"

[[tool.source]]
owner = "fan"
usage = "Read the thermal guard's service; the guard powers the PS5 off with it at the shutdown limit."
need = "required"

[[tool.source]]
owner = "cec"
usage = "Start and stop the watcher that follows the TV, and reload Valve's CEC daemon."
need = "required"

[[tool]]
name = "firewall-cmd"
description = "Checks the firewall state before SFTP Tools opens SSH access."
executables = ["firewall-cmd"]

[[tool.source]]
owner = "sftp"
usage = "Inspect or open the SSH firewall service."
need = "optional"

[[tool]]
name = "notify-send"
description = "Shows desktop notifications."
executables = ["notify-send"]

[[tool.source]]
owner = "controller"
usage = "Show controller status notifications."
need = "optional"

[[tool.source]]
owner = "fan"
usage = "The thermal guard's warning on the desktop before it cools or shuts down."
need = "optional"

[[tool]]
name = "paplay"
description = "Plays the optional connection sounds in SFTP Tools."
executables = ["paplay"]

[[tool.source]]
owner = "sftp"
usage = "Play connection and transfer sounds."
need = "optional"

[[tool]]
name = "cec-ctl"
rpm = "v4l-utils"
description = "Sends and reads HDMI-CEC messages through the kernel's CEC adapters (v4l-utils). Part of Bazzite."
executables = ["cec-ctl"]

[[tool.source]]
owner = "cec"
usage = "Every message to the TV: power, input and the remote's keys."
need = "required"

[[tool]]
name = "FFmpeg"
description = "The audio and video codec library. Remote Play carries its own inside the app's native core, so nothing is installed on the system for it; checked by asking the installed core which version it holds."
executables = []
locations = ["~/.local/share/ps5-remoteplay/venv/bin/python"]
probe = "console-link-ffmpeg"

[[tool.source]]
owner = "remoteplay"
usage = "Decodes the stream's picture and sound; without it there is no stream. It comes with the app: install the app again through the portal when it is missing."
need = "required"
