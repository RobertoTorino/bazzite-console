# Builds the Python module ps5_remoteplay_core: maturin build --release (a wheel for Python 3.10 and newer), or
# maturin develop to install it into the current venv for the tests.
[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "ps5-remoteplay-core"
version = "1.0.0"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }

[tool.maturin]
features = ["python", "pyo3/extension-module"]
