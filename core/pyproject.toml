# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazzite-console-core"
version = "4.8.1"                     # = VERSION; tools/check_versions.py keeps them equal
description = "Shared code of the Bazzite Console Suite apps"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.11,<7"]

[tool.setuptools]
packages = ["bazzite_console_core"]

[tool.setuptools.package-data]
bazzite_console_core = ["fonts/*"]
