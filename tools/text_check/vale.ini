# Vale's settings for tools/text_check.py: the rule sets for readability and style. The rule sets are kept in
# styles/, so a run needs no download. To update them: cd tools/text_check && vale --config vale.ini sync
StylesPath = styles
MinAlertLevel = suggestion
Packages = write-good, proselint, Readability

[*.md]
BasedOnStyles = write-good, proselint, Readability
