# SPDX-License-Identifier: GPL-3.0-or-later

site_name: Bazzite Console Suite
site_description: Tools for PlayStation 5 hardware running Bazzite
site_url: https://robertotorino.github.io/bazzite-console/
repo_url: https://github.com/RobertoTorino/bazzite-console
repo_name: RobertoTorino/bazzite-console
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
plugins:
  - search
  - privacy
hooks:
  - tools/mkdocs/hooks.py
  - tools/mkdocs/design_panel.py
  - tools/mkdocs/disclaimer.py
theme:
  name: material
  custom_dir: tools/mkdocs/overrides
  logo: images/wiki-icon.webp
  favicon: images/wiki-icon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tooltips
extra_css:
  - stylesheets/suite.css
extra:
  generator: false
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Install: install.md
  - Portal: portal.md
  - Portal Tour: portal-tour.md
  - Apps:
      - apps/index.md
      - App categories: apps/categories.md
      - Covers from SteamGridDB: apps/covers.md
      - Sustainable:
          - Bazzite Test: apps/bazzite.md
          - Fan Control: apps/fan.md
          - System Overlay: apps/overlay.md
      - Graphics:
          - "Coming soon.": apps/graphics.md
      - Gaming:
          - Bazzite DatStation: apps/datstation.md
          - PCSX2 Manager: apps/pcsx2.md
          - PPSSPP Manager: apps/ppsspp.md
          - Remote Play: apps/remoteplay.md
          - RPCS3 Manager: apps/rpcs3.md
          - shadPS4 Manager: apps/shadps4.md
          - Vita3K Manager: apps/vita3k.md
          - XBOX Remote Play: apps/clb.md
          - Xenia Manager: apps/xenia.md
      - Utilities:
          - Controller: apps/controller.md
          - HDMI CEC Manager: apps/cec.md
          - SFTP Tools: apps/sftp.md
          - SSD Check: apps/ssd.md
          - Webcam: apps/webcam.md
  - Development:
      - development/index.md
  - Security:
      - Security policy: SECURITY.md
      - Privacy: privacy.md
  - History:
      - What is Bazzite: history/bazzite.md
      - What is PlayStation 5: history/ps5.md
validation:
  links:
    anchors: warn
