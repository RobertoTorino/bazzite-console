# SPDX-License-Identifier: GPL-3.0-or-later

site_name: Bazzite Console Suite
site_description: Tools for PlayStation 5 hardware running Bazzite
site_url: https://robertotorino.github.io/bazzite-console/
repo_url: https://github.com/RobertoTorino/bazzite-console
repo_name: RobertoTorino/bazzite-console
edit_uri: edit/main/docs/
docs_dir: docs
strict: true
plugins:
  - search
  - privacy
hooks:
  - tools/mkdocs/hooks.py
  - tools/mkdocs/design_panel.py
  - tools/mkdocs/disclaimer.py
theme:
  name: material
  custom_dir: tools/mkdocs/overrides
  logo: images/wiki-icon.webp
  favicon: images/wiki-icon.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tooltips
extra_css:
  - stylesheets/suite.css
extra:
  generator: false
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
nav:
  - Home: index.md
  - Install: install.md
  - Portal: portal.md
  - Portal Tour: portal-tour.md
  - PS5 Linux boot partition: boot-partition.md
  - Apps:
      - apps/index.md
      - App categories: apps/categories.md
      - Covers from SteamGridDB: apps/covers.md
      - Sustainable:
          - PS5 Board Test: apps/board.md
          - PS5 Core Unlock: apps/cores.md
          - PS5 CU Unlock: apps/compute.md
          - PS5 Fan Controller: apps/fan.md
          - PS5 GPU Manager: apps/gpu.md
          - PS5 System Overlay: apps/overlay.md
      - Graphics:
          - PS5 Upscaler Manager: apps/upscaler.md
      - Gaming:
          - PS5 DatStation: apps/datstation.md
          - PS5 KytyPS5 Manager: apps/kytyps5.md
          - PS5 PCSX2 Manager: apps/pcsx2.md
          - PS5 PPSSPP Manager: apps/ppsspp.md
          - PS5 RPCS3 Manager: apps/rpcs3.md
          - PS5 shadPS4 Manager: apps/shadps4.md
          - PS5 Vita3K Manager: apps/vita3k.md
          - PS5 Xenia Manager: apps/xenia.md
          - Remote Play: apps/remoteplay.md
          - XBOX Remote Play: apps/clb.md
      - Utilities:
          - PS5 Bluetooth: apps/bluetooth.md
          - PS5 CEC Manager: apps/cec.md
          - PS5 Controller: apps/controller.md
          - PS5 Password Generator: apps/password.md
          - PS5 Quickfix: apps/quickfix.md
          - PS5 SFTP Tools: apps/sftp.md
          - PS5 SSD Check: apps/ssd.md
          - PS5 Turing Screen: apps/turing.md
          - PS5 Webcam: apps/webcam.md
  - Development:
      - development/index.md
      - Architecture and consistency: development/architecture.md
      - Dashboard: development/dashboard.md
      - Releases: development/releases.md
      - All tests: development/all-tests.md
      - GitHub settings: development/github-settings.md
      - "Remote Play: the stream's threads": development/remoteplay-stream.md
  - Security:
      - Security policy: SECURITY.md
      - Privacy: privacy.md
  - History:
      - What is Bazzite: history/board.md
      - What is PlayStation 5: history/ps5.md
validation:
  links:
    anchors: warn
