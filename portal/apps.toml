[apps.fan]
name = "PS5 Fan Controller"
summary = "The PS5's temperatures and fan, and a thermal guard that warns, cools and shuts down cleanly at a critical temperature."
tag = "ps5-fan-v2.9.2"
sha256 = "6bd32756e13fa97e3325b4c02d668fbd8198ee3a1278cb253fe6082f057140c7"
required = false
changes_board = true
board_change = """
The thermal guard is a root system service, ps5-fan-controller-guard.service with its files in /etc/ps5-fan-controller,
that reads the temperatures every two seconds. At the cool limit it sets the fan to full speed in sysfs (ps5_fan's
full mode) and turns the CPU boost off (ps5_control --boost off); at the shutdown limit, held for the set number of
seconds, it powers the PS5 off cleanly with systemctl poweroff. The service stays enabled across reboots and power
offs. The fan setting is written in memory only, and the guard puts the saved mode back when it re-arms or stops.
Nothing is written to the firmware or the kernel's arguments. Turn off disables the service and removes its files;
the fan is back on its previous mode, and the boost, once the guard turned it off, stays off until you turn it on
again or reboot.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/ps5-fan-controller"]
launch = [["Open", "~/.local/bin/ps5-fan-controller"]]

[apps.compute]
name = "PS5 CU Unlock"
summary = "Tell bad CUs apart from an unstable CU unlock, and apply a tested unlock."
tag = "ps5-compute-v1.2.0"
sha256 = "319c29517d14eafbddac4bed4dfca1b61f74073758a205b515673e154bd513b7"
required = false
changes_board = true
board_change = """
For the CU unlock, the app writes the GPU's shader array and WGP mask registers with umr. It does so as root, while
the driver runs. The registers are volatile. Any reboot puts the stock 24 CUs back, and nothing is burned into the
chip. The unlock stays across reboots and power offs only through the root service that CU Unlock installs. That
service is ps5-cu-unlock.service, with the masks in /etc/ps5-cu-bisect. It writes the registers again early at
every boot. Nothing is written to the BIOS, the firmware, the CMOS or the kernel's arguments. Uninstall in CU Unlock
disables the service and removes its files. The unlock then lasts until the next reboot, and after it the board is
stock. CU Unlock runs every attempt of a test in one boot by default, and writes the board's own masks back between
attempts. With Same boot off, it asks once and then restarts the board by itself after each attempt. While such a
test runs, an autostart entry opens the window again after each login. The entry goes when the test ends, is paused
or is removed with the app.
"""
category = "sustainable"
install = ["bash packaging/bazzite/install-bisect-gui.sh"]
uninstall = ["bash packaging/bazzite/uninstall-bisect-gui.sh", "bash packaging/bazzite/uninstall-gui.sh"]
detect = ["~/.local/bin/ps5-bisect-gui"]
launch = [["Open", "~/.local/bin/ps5-bisect-gui"]]

[apps.cores]
name = "PS5 Core Unlock"
summary = "Tell bad CPU cores apart from an unstable core unlock, before you persist the 8C/16T unlock."
tag = "ps5-cores-v1.0.2"
sha256 = "88a25eec69288be0b673fced790694f1735082d5107f57a0e0f9c6157fca2c22"
required = false
changes_board = true
board_change = """
The app sends the SoC's SMU one mailbox message over PCI configuration space with setpci. The message sets the core
presence mask to 0xFF in the SMU's own memory. The governor's service shares the mailbox, so the app stops it around
the message and starts it again. The mask takes effect on the next warm reboot and survives warm reboots. A full
power off reverts it to the stock 6 cores. The 8 cores stay across power offs only through the root service that
Core Unlock installs, ps5-cores-unlock.service. After a cold boot the service sends the message again and
warm-reboots once. A guard keeps it from reboot loops. Nothing is written to the BIOS, the firmware, the CMOS or the
kernel's arguments. Uninstall in Core Unlock disables the service and removes its files. The cores stay on until the
next full power off, and after it the board is stock. Core Unlock restarts the board after the core unlock, and
between its rounds when Same boot is off. It counts down 15 seconds first, and Pause stops it.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/ps5-cores-bisect-gui"]
launch = [["Open", "~/.local/bin/ps5-cores-bisect-gui"]]

[apps.gpu]
name = "PS5 GPU Manager"
summary = "Manage the cyan-skillfish GPU governor, with tuning, safe points, profiles and backups."
tag = "ps5-gpu-v0.1.2"
sha256 = "77d8e83a30a25879d948e6a6c4cbab26399f18a526b25dbf506bf0ea3790ca84"
required = false
changes_board = true
board_change = """
The app edits the governor's settings file, /etc/cyan-skillfish-governor-smu/config.toml, or the tt governor's.
Before each change from its pages it makes a dated backup of the file beside it. It starts, stops, enables and
disables the governor's service. It sends the governor clock, voltage and range requests over D-Bus. The governor is
what sets the GPU's clocks and voltages. The app never writes a register itself. For each attempt, the GPU sweep
puts a test clock and voltage in the settings file and restarts the governor. It puts your own file back after each
attempt, on a temperature abort and when it stops. A freeze can leave the test settings in the file. The sweep then
puts your own file back first, at its next attempt. Install in the sweep makes a dated backup, writes the best step
into the file and restarts the governor. The settings file stays across reboots and power offs. The governor reads
it whenever it starts. What the app sets over D-Bus, test mode included, lasts until the governor restarts. Nothing
is written to the BIOS, the firmware, the CMOS or the kernel's arguments. Restore selected on the Backups page makes
any earlier settings file the current one again. Stop test ends a test, and Stop ends an attempt of the sweep.
Removing the app leaves the settings file and its backups as they are.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/ps5-governor-manager"]
launch = [["Open", "~/.local/bin/ps5-governor-manager"]]

[apps.cec]
name = "PS5 CEC Manager"
summary = "Turn the TV on and off with the PS5, switch its input and use its remote, over HDMI-CEC."
tag = "ps5-cec-v2.10.2"
sha256 = "2e737757beb270bf2073c9b6888f6c23005ce235eaaccbd430a431702f3f0f9d"
required = false
changes_board = true
board_change = """
Power button, once you check it and give your password, installs a system service with its script:
/etc/systemd/system/ps5-cec-manager-standby.service and /etc/ps5-cec-manager/standby. Around every sleep the script
makes the light bar breathe orange, turns the CPU boost off and picks a power-saving profile. At the wake it puts all
three back. It also writes /etc/systemd/logind.conf.d/90-ps5-cec-manager-power-key.conf, so a press at the login
screen no longer powers the board off. It adds your user to the input group and sets the desktop's power button to
do nothing. These stay across reboots and power offs. Nothing is written to the board's firmware or the kernel's
arguments. Unchecking it removes the three files and puts the desktop's button action back. The input group stays.
The rest of the app only sends CEC messages and changes nothing on the board.
"""
category = "utilities"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/ps5-cec-manager"]
launch = [["Open", "~/.local/bin/ps5-cec-manager"]]

