[apps.fan]
name = "Fan Control"
summary = "The PS5's temperatures and fan, and a thermal guard that warns, cools and shuts down cleanly at a critical temperature."
tag = "ps5-fan-v0.1.1"
sha256 = "4cf5b41064f5af7a0602207a86138724d3ead24daa0ac877dd902a7fa9782128"
required = false
changes_board = true
board_change = """
The thermal guard is a root system service, ps5-fan-control-guard.service with its files in /etc/ps5-fan-control,
that reads the temperatures every two seconds. At the cool limit it sets the fan to full speed in sysfs (ps5_fan's
full mode) and turns the CPU boost off (ps5_control --boost off); at the shutdown limit, held for the set number of
seconds, it powers the PS5 off cleanly with systemctl poweroff. The service stays enabled across reboots and power
offs. The fan setting is written in memory only, and the guard puts the saved mode back when it re-arms or stops.
Nothing is written to the firmware or the kernel's arguments. Turn off disables the service and removes its files;
the fan is back on its previous mode, and the boost, once the guard turned it off, stays off until you turn it on
again or reboot.
"""
category = "sustainable"
install = ["bash install.sh"]
uninstall = ["bash install.sh --uninstall"]
detect = ["~/.local/bin/ps5-fan-control"]
launch = [["Open", "~/.local/bin/ps5-fan-control"]]

