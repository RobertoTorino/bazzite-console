# Each [apps.<name>] table pins one release of a suite app. The required apps are installed with the portal, bundled
# in its release and never uninstalled on their own: board (Board Test, always the first tile) and helpers (owner,
# 15-11-2026). An app made of small helpers lists each as an [[apps.<name>.helpers]] table (key, name, summary,
# launch: one command, and changes_board/board_change): the portal shows a tile per helper in the app's category and
# none for the app; installing and updating stay the app's.

