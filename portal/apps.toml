[[apps.quickfix.quickfixes]]
key = "mangohud"
name = "MangoHud Config"
summary = "Open or create MangoHud's config, edit and save it; turn on the FPS log Board Test reads."
launch = "~/.local/bin/ps5-quickfix mangohud"

[[apps.quickfix.quickfixes]]
key = "mapcount"
name = "Game Memory Map"
summary = "Raise vm.max_map_count, the number of memory areas a game may map."
launch = "~/.local/bin/ps5-quickfix mapcount"
changes_board = true
board_change = """
Turn on writes vm.max_map_count = 2147483642 to /etc/sysctl.d/90-ps5-quickfix-max-map-count.conf and sets it now:
the number of memory areas one program may map. The file stays across reboots and power offs. Nothing is written to
the board's firmware or the kernel's arguments. Turn off removes the file and reads the system's settings again,
so the value the other settings files give, else the kernel's own, is back.
"""

[[apps.quickfix.quickfixes]]
key = "journal"
name = "Persistent Journal"
summary = "Keep the system journal on the disk, so the logs of a boot that crashed can be read after it."
launch = "~/.local/bin/ps5-quickfix journal"
changes_board = true
board_change = """
Turn on makes the folder /var/log/journal, with systemd-tmpfiles, and moves the journal there: journald then keeps
the system's logs on the disk, within its own size limits, instead of in memory only. The folder stays across reboots
and power offs. Nothing is written to the board's firmware. Turn off works only on a folder this quickfix made: it
moves the journal back to memory and removes the folder, with the logs in it.
"""

[[apps.quickfix.quickfixes]]
key = "ethernet"
name = "Ethernet First"
summary = "Turn the Wi-Fi off while a network cable is connected, and on again when the cable is gone."
launch = "~/.local/bin/ps5-quickfix ethernet"
changes_board = true
board_change = """
Turn on writes a NetworkManager hook, /etc/NetworkManager/dispatcher.d/90-ps5-quickfix-ethernet-first, and a timer,
ps5-quickfix-ethernet-first.timer, that runs it 45 seconds after boot. The hook turns the Wi-Fi off while a network
port of the board has a cable with a link. It turns the Wi-Fi on again when the cable is gone, but only when it turned
it off itself.
The files stay across reboots and power offs. Nothing is written to the board's firmware or the kernel's arguments.
Turn off removes the hook and the timer, and turns on the Wi-Fi the hook turned off.
"""

[[apps.quickfix.quickfixes]]
key = "cmdline"
name = "Boot Command Line"
summary = "Edit cmdline.txt, the kernel command line the PS5 loader starts Linux with."
launch = "~/.local/bin/ps5-quickfix cmdline"
changes_board = true
board_change = """
Save writes the edited line to /boot/efi/cmdline.txt, the kernel command line the PS5 loader starts Linux
with, or to the fallback line it opened beside it (cmdline.txt.m2 or cmdline.txt.usb), after it asks and after your
password, and keeps the file it replaces as a dated backup beside it (for example cmdline.txt.bak-YYYYMMDD-HHMMSS). A
change to cmdline.txt changes the boot settings of PS5 Linux from the next boot: a wrong argument can keep Linux from
starting. The file stays across reboots and power offs. A line without root=, or of more than one line, is not
saved. Nothing is written to the board's firmware. To undo it, edit the line back, or copy a backup over the file.
"""

