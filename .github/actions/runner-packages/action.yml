# SPDX-License-Identifier: GPL-3.0-or-later
# What a job needs from Ubuntu's mirror (Qt's libraries, Bazzite's font), without a download per job: the packages
# are in GitHub's cache, and tools/ci-qt-libs.sh and tools/ci-font.sh install them from there (tools/ci-apt.sh).
# ci.yml's plan job fills the cache (fetch-only) before the jobs that need the packages start, so they all find
# them. The cache is one per week and per Ubuntu release, not per image: GitHub's runners are on several images at a
# time (four in one run on 20-11-2026), and a cache per image left the jobs on the other three to download for
# themselves. A new week starts from the week before (restore-keys), so apt downloads only a package whose version
# moved; all of it is downloaded again only when one of the scripts changes or GitHub dropped the cache.
name: Runner packages
description: Qt's libraries and Bazzite's font from GitHub's cache
inputs:
  pulse:
    description: Also libpulse0 and libva, for Qt Multimedia in the apps' tests
    default: "false"
  font:
    description: Also Bazzite's font, for the tests that measure a window and the picture of the portal
    default: "false"
  fetch-only:
    description: Fill the cache and install nothing (the plan job)
    default: "false"
runs:
  using: composite
  steps:
    - id: image
      shell: bash
      run: |
        echo "name=${ImageOS:-none}" >> "$GITHUB_OUTPUT"
        echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6
      with:
        path: ~/.cache/ci-apt
        key: >-
          ci-apt-${{ steps.image.outputs.name }}-${{
          hashFiles('tools/ci-apt.sh', 'tools/ci-qt-libs.sh', 'tools/ci-font.sh') }}-${{ steps.image.outputs.week }}
        restore-keys: >-
          ci-apt-${{ steps.image.outputs.name }}-${{
          hashFiles('tools/ci-apt.sh', 'tools/ci-qt-libs.sh', 'tools/ci-font.sh') }}-
    - shell: bash
      env:
        PULSE: ${{ inputs.pulse == 'true' && '--pulse' || '' }}
        FONT: ${{ inputs.font }}
        FETCH: ${{ inputs.fetch-only == 'true' && '--fetch' || '' }}
      run: |
        # shellcheck disable=SC2086  # an empty option is no option
        bash tools/ci-qt-libs.sh $PULSE $FETCH
        if [ "$FONT" = true ]; then bash tools/ci-font.sh $FETCH; fi
