name: Bug report
description: Something in the portal or one of the apps doesn't work, or a value or test result looks wrong.
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - portal
        - board
        - upscaler
        - rpcs3
        - remoteplay
        - clb
        - shadps4
        - datstation
        - ppsspp
        - pcsx2
        - vita3k
        - xenia
        - sftp
        - webcam
        - controller
        - ssd
        - overlay
        - fan
        - compute
        - cores
        - cec
        - bluetooth
        - quickfix
        - password
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The app's About or Settings page, or `--version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: bazzite
    attributes:
      label: Bazzite version
      description: Run `grep -E '^(NAME|VERSION)=' /etc/os-release; uname -r` in a terminal and copy the lines.
      placeholder: "NAME=\"Bazzite\" VERSION=\"43.20261001.0 (Kinoite)\" 7.3.1"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Report or log
      description: >-
        board: Show Logs → the full report of the run. Other apps: their log, if they show one.
        Drag the file here or paste the relevant part.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I read what I attached and removed anything I don't want to share.
          required: true
