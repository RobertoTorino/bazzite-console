name: Bug report
description: Something in the portal or one of the apps doesn't work, or a value or test result looks wrong.
labels: [bug]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options:
        - portal
        - bazzite
        - upscaler
        - rpcs3
        - remoteplay
        - clb
        - shadps4
        - datstation
        - ppsspp
        - pcsx2
        - vita3k
        - xenia
        - sftp
        - webcam
        - controller
        - ssd
        - overlay
        - fan
        - cec
        - btpair
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: The app's About or Settings page, or `--version`.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: bazzite
    attributes:
      label: Bazzite version
      description: Run `rpm-ostree status` in a terminal and copy the Version line of the deployment marked ●.
      placeholder: "42.20261001.0 (2026-10-01T04:43:45Z)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Report or log
      description: >-
        Bazzite Test: Show Logs → the full report of the run. Other apps: their log, if they show one.
        Drag the file here or paste the relevant part.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I read what I attached and removed anything I don't want to share.
          required: true
