name: Wiki

# Builds the wiki (MkDocs Material) from main and publishes it on GitHub Pages, at
# https://robertotorino.github.io/bazzite-console/ (Settings -> Pages -> Source: GitHub Actions).

# A published portal release builds it again, so the Install page names that release. That run belongs to the
# release's tag, which the github-pages environment does not deploy from (main only), so it starts this workflow on
# main instead and builds nothing itself.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A release's run is in a group of its own: in "pages" the run it starts on main would cancel it.
concurrency:
  group: ${{ github.event_name == 'release' && format('pages-release-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: true

jobs:
  from-main:                            # a release's run: start the workflow on main, where Pages deploys from
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0                # the tags: the Install page names the newest published portal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs requirements
        run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2" "pillow>=12,<13"
      - name: Qt runtime libraries
        run: bash tools/ci-qt-libs.sh
      - name: Build the wiki
        run: mkdocs build --strict --site-dir site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
