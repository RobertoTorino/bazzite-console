name: Release

# The releases of the Bazzite Console Suite, in one of two ways:
#
# * A release of the suite: Nexus Release Tool's Start new release starts this workflow with the release commit it
#   pushed (the versions, the CHANGELOG entries, the new tags in apps.toml, portal/VERSION). One run
#   releases the suite: it builds every app tag apps.toml pins that has no release yet, side by side, and publishes
#   each (the tag made on the release commit); writes their sha256 into apps.toml in one commit "Pin ..." on top
#   of it; and builds the portal from that commit as a draft release (no tag
#   yet, so no portal sees it). The Nexus Release Tool installs that draft on the board (check-release.sh draft) and
#   publishes it after the owner's yes, which makes the portal tag and GitHub's Latest release.
#   Started again, the run skips what is out already and makes the draft anew. The pin commit is pushed only while
#   main is still the release commit, so no other commit gets into a portal tag.
# * A tag pushed by hand, ps5-<app>-v<x.y.z> or ps5-portal-v<x.y.z> (ps5-board-v0.1.0, ps5-fan-v2.0.0): that one
#   release, published at once. The tag's version must equal that app's VERSION. A tag whose release is published
#   already is left alone: the Nexus Release Tool's Publish makes the portal tag of a release that way, on the pin
#   commit, which has no CI run (a push with the workflow's token starts no workflow), so the run would only wait for CI
#   in vain.
#
# The assets are <tag>.tar.gz, SHA256SUMS and the notes, all built by tools/build_release.py, so a local build has
# the same content (the suite's wiki, "Checking a release"). A portal release bundles the releases of the required
# apps (Board Test, board, and PS5 Quickfix, quickfix) that portal/apps.toml pins (each downloaded from its own
# release and checked against the pin) and requires every pinned tag to exist. GitHub's "Latest" is the newest portal (publish_release.sh, and Publish for a draft), so
# the releases page and the app releases' notes lead there.
#
# Remote Play ships the wheel of its native core in the tarball (native/wheel): built here from the tag, with
# FFmpeg from its pinned sources (native/ffmpeg/build.sh), outside the checkout (PS5_NATIVE_WHEEL_DIR, which
# build_release.py reads), so installing needs only pip.
#
# Only a commit that CI passed becomes a release: the first job waits for CI (ci.yml) on the commit, up to 75
# minutes; a release started by Nexus Release Tool also only on main's newest commit. A release commit that only
# writes the release (versions, Release entries, apps.toml's tags: tools/release_commit.py) takes the CI that passed
# on its work commit, the parent (owner, 30-10-2026: CI ran twice on the same code); anything more waits for CI on
# the commit itself. The pin commit changes only sha256 lines and is
# checked here (check_manifest.py --require-tags). tools/tag-release.sh asks the same before it tags.
#
# By hand: gh workflow run release.yml --ref main -f commit="$(git rev-parse origin/main)"
#
# The jobs run in no environment, so GitHub asks no approval before it builds and publishes (owner, 23-10-2026:
# approving every tag took too long when one change to core makes many app releases).

on:
  push:
    tags: ["*-v[0-9]*.[0-9]*.[0-9]*"]
  workflow_dispatch:
    inputs:
      commit:
        description: The release commit (main's newest)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    # One job for what was two (ci, then plan; owner, 17-11-2026): every job waits for a runner of its own, and
    # that wait was a fifth of a release. First whether the commit may be released (CI passed on it, and for a
    # release Nexus Release Tool started it is main's newest), then what this run releases.
    runs-on: ubuntu-latest
    timeout-minutes: 90                 # ci_state waits up to 75
    permissions:
      actions: read
      contents: read
    outputs:
      out: ${{ steps.out.outputs.out }}
      apps: ${{ steps.plan.outputs.apps }}
      portal: ${{ steps.plan.outputs.portal }}
      draft: ${{ steps.plan.outputs.draft }}
    env:
      COMMIT: ${{ inputs.commit || github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Not published already
        id: out
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
            echo "$TAG is published already (the Nexus Release Tool's Publish made the tag): nothing to do."
            echo "out=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.out.outputs.out != 'true'
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0                # the parent (a release commit's work commit) and the tags, for check_manifest
      - name: The release commit is main's newest
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch -q origin main
          head=$(git rev-parse origin/main)
          [ "$head" = "$(git rev-parse HEAD)" ] ||
            { echo "main is $head, not the release commit $COMMIT: start the release again on the new main." >&2; exit 1; }
      - name: CI passed on this commit
        if: steps.out.outputs.out != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci_state.py --release-commit --wait 75 "$COMMIT"
      - uses: actions/setup-python@v7
        if: steps.out.outputs.out != 'true'
        with:
          python-version: "3.12"
      - name: Checks
        if: steps.out.outputs.out != 'true'
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          python tools/check_versions.py
          case "$TAG" in
            *-portal-v*) python tools/check_manifest.py --require-tags ;;
            *)           python tools/check_manifest.py ;;
          esac
      - name: What this run releases
        if: steps.out.outputs.out != 'true'
        id: plan
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: |
          python tools/suite_release.py plan ${TAG:+--tag "$TAG"} | tee -a "$GITHUB_OUTPUT"

  apps:
    needs: plan
    if: needs.plan.outputs.out != 'true' && needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                  # one app's failure leaves the others' releases: a run started again skips them
      matrix:
        tag: ${{ fromJSON(needs.plan.outputs.apps) }}
    env:
      TAG: ${{ matrix.tag }}
      COMMIT: ${{ inputs.commit || github.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0                # tags, for check_manifest and the reproducible mtime

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Native wheel (consoles releases)
        if: startsWith(matrix.tag, 'ps5-remoteplay-v')
        working-directory: apps/remoteplay/native
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nasm libva-dev
          ffmpeg/build.sh "$RUNNER_TEMP/ffmpeg"
          python -m pip install -q "maturin>=1.5,<2"
          PS5_FFMPEG_DIR="$RUNNER_TEMP/ffmpeg" maturin build --release --locked --compatibility linux \
            --features python,pyo3/extension-module,decoder --out "$RUNNER_TEMP/wheel"
          echo "PS5_NATIVE_WHEEL_DIR=$RUNNER_TEMP/wheel" >> "$GITHUB_ENV"

      - name: Build
        run: |
          python tools/build_release.py "$TAG" dist
          cat dist/SHA256SUMS

      - name: Publish
        run: bash tools/publish_release.sh "$TAG" "$COMMIT" dist

  portal:
    # One job for what was two (pin, then portal; owner, 17-11-2026: a runner less to wait for). The new app
    # releases are pinned in apps.toml in a commit on top of the release commit, and the portal is built from that
    # commit.
    needs: [plan, apps]
    if: ${{ !cancelled() && !failure() && needs.plan.outputs.portal != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.plan.outputs.portal }}
      COMMIT: ${{ inputs.commit || github.sha }}
      APPS: ${{ needs.plan.outputs.apps }}
      DRAFT: ${{ needs.plan.outputs.draft }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0                # tags, for check_manifest and the reproducible mtime

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pin the new app releases
        id: pin
        run: |
          mapfile -t tags < <(python -c 'import json, os; print("\n".join(json.loads(os.environ["APPS"])))')
          if [ "$DRAFT" != true ] || [ ${#tags[@]} -eq 0 ] || [ -z "${tags[0]}" ]; then
            echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"          # a tag pushed by hand, or nothing to pin
            exit 0
          fi
          git fetch -q origin main
          head=$(git rev-parse origin/main)
          if [ "$head" != "$COMMIT" ]; then
            # Started again after the pins were pushed: main is that pin commit, right on top of the release commit.
            if [ "$(git rev-parse "$head^")" = "$COMMIT" ] && git log -1 --format=%s "$head" | grep -q '^Pin '; then
              echo "Pinned already in $head"
              echo "commit=$head" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "main moved on from the release commit $COMMIT to $head: nothing is pinned or tagged." >&2
            echo "Start the release again from Nexus Release Tool on the new main." >&2
            exit 1
          fi
          for tag in "${tags[@]}"; do
            gh release download "$tag" --pattern SHA256SUMS --dir "sums/$tag"
          done
          python tools/suite_release.py pin sums "${tags[@]}"
          rm -rf sums
          git fetch -q --tags origin                     # the tags the apps' releases just made
          python tools/check_manifest.py --require-tags
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portal/apps.toml
          git commit -q -m "Pin ${tags[*]}"
          git push origin "HEAD:refs/heads/main"         # refused when main moved meanwhile: nothing is tagged
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: The commit the portal is built from
        env:
          PINNED: ${{ steps.pin.outputs.commit }}
        run: |
          git fetch -q --tags origin                     # the tags the apps' releases just made
          git checkout -q "$PINNED"                      # the pin commit: made here, or by the run before

      - name: Checks
        run: |
          python tools/check_versions.py
          python tools/check_manifest.py --require-tags

      - name: The bundled required apps
        run: |
          # Board Test and PS5 Quickfix: each release in a folder of its own, its SHA256SUMS beside it.
          for required in $(python -c 'import tomllib; apps = tomllib.load(open("portal/apps.toml", "rb"))["apps"]; print(" ".join(a["tag"] for a in apps.values() if a.get("required")))'); do
            mkdir -p "bundle/$required"
            gh release download "$required" --pattern "$required.tar.gz" --pattern SHA256SUMS --dir "bundle/$required"
          done

      - name: Build
        run: |
          python tools/build_release.py "$TAG" dist --bundle bundle
          cat dist/SHA256SUMS

      - name: Publish
        env:
          COMMIT: ${{ steps.pin.outputs.commit }}
        run: |
          args=()
          [ "$DRAFT" = true ] && args+=(--draft)
          bash tools/publish_release.sh "$TAG" "$COMMIT" dist "${args[@]}"
