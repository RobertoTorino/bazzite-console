# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        directory:
          - apps/bazzite
          - apps/cec
          - apps/fan
          - apps/overlay
          - apps/clb
          - apps/remoteplay
          - apps/datstation
          - apps/webcam
          - apps/controller
          - apps/pcsx2
          - apps/ppsspp
          - apps/rpcs3
          - apps/sftp
          - apps/shadps4
          - apps/ssd
          - apps/vita3k
          - apps/xenia
          - portal
          - tools
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.directory }}/requirements-dev.txt
      - name: Qt runtime libraries
        if: startsWith(matrix.directory, 'apps/') || matrix.directory == 'portal'
        working-directory: .
        run: bash tools/ci-qt-libs.sh --pulse
      - name: Install
        run: python -m pip install -q -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check release manifest
        run: python tools/check_manifest.py
      - name: Check the category icons' copies
        run: python tools/sync_icons.py --check

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: find apps portal tools -name '*.sh' -print0 | xargs -0 -n1 bash -n

  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install fakeroot
        run: sudo apt-get update -q && sudo apt-get install -y -q fakeroot
      - name: Installer tests
        run: |
          failed=()
          run() {
            echo "::group::${1##*/}"
            bash "$1" || { echo "::error file=$1::${1##*/} failed"; failed+=("${1##*/}"); }
            echo "::endgroup::"
          }
          for t in tools/installer-tests/*.sh; do
            [ "${t##*/}" = shims.sh ] || run "$t"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "Failed: ${failed[*]}" >&2; exit 1; }

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install docs requirements
        run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2" "pillow>=12,<13"
      - name: Qt runtime libraries
        run: bash tools/ci-qt-libs.sh
      - name: Build docs
        run: mkdocs build --strict
