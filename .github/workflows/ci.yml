# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

# The checks of the Bazzite Console Suite on every push and pull request. The suite keeps no copy of the Nexus tools
# (owner, 13-11-2026: one repository per suite, the tooling in Nexus): every job starts with Nexus's action
# (RobertoTorino/nexus/.github/actions/suite), which checks out Nexus at the commit NEXUS_REF names and this
# repository inside it as bazzite-console/, the layout the Nexus tools know. So the paths below are written from the
# Nexus root, and git in bazzite-console/ is this repository's. The suite's core is its own
# (core/bazzite_console_core). Its tags (ps5-<app>-v<x.y.z>) wait for this workflow on the commit (release.yml).

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: bazzite-console
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Versions
        run: python tools/check_versions.py --suite bazzite-console
      - name: Portal manifest
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python bazzite-console/tools/check_manifest.py ${BASE:+--base "$BASE"}

  nexus-tools:
    # The Nexus tools' own tests with this suite in the checkout: the ones about a suite (its layout, its workflows,
    # its wiki's disclaimer) cannot run in Nexus's CI, which has no suite of another repository.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: bazzite-console
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "tools/requirements-dev.txt"
      - name: Qt runtime libraries
        timeout-minutes: 5
        run: bash tools/ci-qt-libs.sh --pulse
      - name: Install
        run: python -m pip install -q -r tools/requirements-dev.txt
      - name: Test
        working-directory: tools
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dirs: ${{ steps.plan.outputs.dirs }}
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: bazzite-console
      - name: Test folders
        id: plan
        run: python3 tools/ci_matrix.py --suite bazzite-console pytest | tee -a "$GITHUB_OUTPUT"

  pytest:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJSON(needs.plan.outputs.dirs) }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: bazzite-console
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements-dev.txt"
      - name: Qt runtime libraries
        timeout-minutes: 5
        working-directory: .
        run: bash tools/ci-qt-libs.sh --pulse
      - name: Install
        run: python -m pip install -q -r requirements-dev.txt
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -X faulthandler -m pytest -v tests

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: bazzite-console
      - name: Check shell syntax
        run: find bazzite-console -name '*.sh' -not -path '*/.git/*' -print0 | xargs -0 -n1 bash -n
      - name: Shellcheck
        run: |
          shellcheck -x -S error bazzite-console/install.sh bazzite-console/portal/install.sh \
            bazzite-console/apps/*/install.sh bazzite-console/tools/*.sh \
            bazzite-console/tools/installer-tests/*.sh
          shellcheck -x -S warning bazzite-console/tools/check-release.sh \
            bazzite-console/portal/install.sh bazzite-console/apps/bazzite/install.sh \
            bazzite-console/tools/installer-tests/*.sh

  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: bazzite-console
      - name: fakeroot
        run: sudo apt-get install -y -q fakeroot
      - name: Installer tests
        run: |
          failed=()
          run() { echo "::group::${1##*/}"; bash "$1" || { echo "::error file=$1::${1##*/} failed"; failed+=("${1##*/}"); }; echo "::endgroup::"; }
          for t in bazzite-console/tools/installer-tests/*.sh; do
            [ "${t##*/}" = shims.sh ] || run "$t"
          done
          [ ${#failed[@]} -eq 0 ] || { echo "Failed: ${failed[*]}" >&2; exit 1; }

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: RobertoTorino/nexus/.github/actions/suite@main
        with:
          folder: bazzite-console
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -q mkdocs-material "mkdocs>=1.6,<2" "pillow>=12,<13"
      - name: Qt runtime libraries
        timeout-minutes: 5
        run: bash tools/ci-qt-libs.sh
      - run: mkdocs build --strict -f bazzite-console/mkdocs.yml
